# 推送 tag（v*）时自动构建 x86_64 / arm64 两个 DMG 并发布 GitHub Release。
#
# 构建策略（不依赖 Intel 运行器）：
#   - 单个 macos-15（arm64）job：一次 universal 编译（x86_64 + arm64），
#     再用 lipo 拆分出两个单架构 app 分别打 DMG；
#   - 两个分包步骤各自 continue-on-error：某一个 DMG 失败不影响另一个；
#   - 校验步骤只在「两个 DMG 都失败」时使 job 失败；
#   - 发布 job 用 `!cancelled()` 兜底：即使某个分包失败也发布，只附成功 DMG；
#     两个都失败时跳过发布（hashFiles 守卫）。
# 版本号从 tag 注入（v0.2.0 → DMG 内 0.2.0），与 Release 命名一致；
# 手动触发可显式指定版本号；勾选 publish_release 后手动运行也会发布（tag 名 v<version>）。
name: Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 手动构建使用的版本号（如 0.2.0；留空则读 Info.plist）
        required: false
        default: ''
        type: string
      publish_release:
        description: 手动运行时也发布 GitHub Release（需填写 version，tag 名 v<version>）
        required: false
        default: false
        type: boolean

# 同一 ref（tag/分支）上的重复运行自动取消旧的，避免并发抢发 Release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package DMGs
    runs-on: macos-15
    timeout-minutes: 30 # 防止运行器排队/挂起时无限等待
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            if [ "$VERSION" = "$GITHUB_REF" ]; then VERSION=""; fi
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        run: ./Scripts/make-dmg.sh build

      - name: Package DMG (arm64)
        continue-on-error: true # 失败不阻断 x86_64 分包与发布
        run: ./Scripts/make-dmg.sh package ${{ steps.version.outputs.VERSION }} arm64

      - name: Package DMG (x86_64)
        continue-on-error: true
        run: ./Scripts/make-dmg.sh package ${{ steps.version.outputs.VERSION }} x86_64

      - name: Verify at least one DMG
        run: |
          if ! ls dist/*.dmg >/dev/null 2>&1; then
            echo "两个 DMG 都构建失败" >&2
            exit 1
          fi
          ls -lh dist/*.dmg

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: tmskip-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build
    # tag 推送必然发布；手动触发仅当勾选 publish_release 时发布
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.publish_release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 创建 / 更新 Release 及上传资产
    steps:
      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
        continue-on-error: true # 两个架构都失败、无产物时跳过下载，不阻断发布

      - name: List artifacts
        run: ls -la dist || true

      - name: Require version for manual release
        # 手动发布必须带 version，否则无法确定 tag 名
        if: ${{ inputs.publish_release }}
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            echo "::error::手动发布必须填写 version 输入（将作为 tag 名 v<version>）"
            exit 1
          fi

      - name: Create / update release
        # 两个 DMG 都失败时不发空 Release
        if: hashFiles('dist/*.dmg') != ''
        uses: softprops/action-gh-release@v2
        with:
          # tag 推送时留空 → 自动用 GITHUB_REF；手动发布时用 v<version>（tag 不存在会自动创建）
          tag_name: ${{ inputs.publish_release && format('v{0}', inputs.version) }}
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
